name: CI

on:
  pull_request:
  push:
    branches: [claude/charming-lamport-1b9m74]

permissions:
  contents: read

jobs:
  module:
    uses: astorise/Magnetar/.github/workflows/submodule-ci.yml@main
    with:
      module-path: components/kimi
      deny: false
  k2-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Check pinned Kimi K2 configuration and router
        run: cargo +1.100.0 test --locked --test kimi_k2_integration --test pytorch_router_integration
